/* ================= 03 NET: tiny MQTT-over-WebSocket client (public relay) ================= */
/* Falls back to BroadcastChannel (other tabs on the same site) if no relay is reachable.   */
/* To use your own broker:  window.TD_RELAY="wss://your-broker:8084/mqtt"  before pasting.  */
const NET=(()=>{
const BASE="neontd/v2/";
const API={kind:"connecting",ready:false,onmsg:null,trying:false};
const subs=new Set();
const enc=new TextEncoder(),dec=new TextDecoder();
const cat=(...a)=>{let n=0;for(const q of a)n+=q.length;let o=new Uint8Array(n),p=0;for(const q of a){o.set(q,p);p+=q.length}return o};
const U16=n=>new Uint8Array([n>>8,n&255]);
const SS=s=>{let b=enc.encode(s);return cat(U16(b.length),b)};
const pkt=(type,flags,body)=>{let n=body.length,hd=[(type<<4)|flags];do{let b=n&127;n>>=7;if(n)b|=128;hd.push(b)}while(n);return cat(new Uint8Array(hd),body)};

function wsub(t){if(ws&&ws.readyState==1&&API.kind=="relay")ws.send(pkt(8,2,cat(U16(pid++&65535||1),SS(BASE+t),new Uint8Array([0]))))}
function handle(topic,text){
 if(!API.onmsg)return;let o;try{o=JSON.parse(text)}catch(e){return}
 if(o&&typeof o=="object")API.onmsg(topic,o);
}
function fallback(){
 API.kind="local";API.ready=true;
 if(!bc)try{bc=new BroadcastChannel("neontd-v2");bc.onmessage=e=>{let m=e.data;if(m&&subs.has(m.t))API.onmsg&&API.onmsg(m.t,m.o)}}catch(e){API.kind="offline"}
 clearTimeout(rcT);rcT=setTimeout(()=>{if(!closed){ui=0;tryNext()}},10000)   /* keep trying to reach the public relay */
}
function tryNext(){
 if(closed)return;API.trying=true;
 if(ui>=urls.length){API.trying=false;fallback();return}

 try{ws=new WebSocket(url,"mqtt")}catch(e){tryNext();return}

 const fail=()=>{if(g!==gen||done)return;done=true;clearTimeout(tmo);try{ws.close()}catch(e){}tryNext()};
 tmo=setTimeout(fail,5000);
 ws.onopen=()=>{ws.send(pkt(1,0,cat(SS("MQTT"),new Uint8Array([4,2,0,90]),SS("td"+myId+(rnd()*1e6|0)))))};

  if(g!==gen)return;buf=cat(buf,new Uint8Array(ev.data));
  while(buf.length>=2){
   let i=1,mul=1,len=0,b;
   do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128}while(b&128);
   if(buf.length<i+len)return;
   let first=buf[0],t=first>>4,body=buf.subarray(i,i+len);buf=buf.subarray(i+len);
   if(t==2&&!done){ if(body[1]!==0){fail();return}
     done=true;API.trying=false;clearTimeout(tmo);clearTimeout(rcT);try{bc&&bc.close()}catch(e){}bc=null;API.kind="relay";API.ready=true;subs.forEach(wsub);
     clearInterval(pingT);pingT=setInterval(()=>{if(ws&&ws.readyState==1)ws.send(new Uint8Array([0xC0,0]))},20000)}

  }

API.start=()=>{

API.pub=(topic,o)=>{

 if(e.h<=0)return;e.h-=q;if(t)t.dm+=q;

 if(e.h<=1e-6){e.h=0;for(let i=0;i<PN;i++)W[i]+=e.rw;if(t)t.kl++;let j=en.indexOf(e);if(j>=0)en.splice(j,1);ev.push(["k",e.tp,e.x,e.y,e.k,e.rw])}
}
function stP(){
 let cf=CF[DFI];
 /* spawning / wave flow */
 if(wq.length){if(--st<=0){let q=wq.shift();spawnEnemy(q[0]);st=q[1]}}
 else if(!en.length){
  if(!wd){wd=1;let b=M.round(.25*WI(wave));for(let i=0;i<PN;i++)W[i]+=b;cl=360;ev.push(["wc",wave,b])}
  if(wave>=cf.N){gstate=3;ev.push(["end",1]);return}
  if(--cl<=0){startWave(wave+1);cl=360;ev.push(["w",wave])}
 }
 /* enemies */
 for(let i=en.length;i--;){
  let e=en[i],t=pth[e.i];e.rt+=e.tp==3||e.tp==5?.02:.05;
  if((e.tp==3||e.tp==5)&&DFI==2&&--e.sc<=0){e.sc=e.tp==3?300:420;ev.push(["st",e.x,e.y]);for(let u of tw)H(u.x-e.x,u.y-e.y)<(e.tp==3?290:230)&&(u.sn=e.tp==3?135:90)}
  if(!t){let dmg=e.tp==3||e.tp==5?999:e.tp==2?cf.bl:e.tp==4?2:1;lives-=dmg;ev.push(["u",dmg]);en.splice(i,1);if(lives<=0){lives=0;gstate=4;ev.push(["end",0]);return}continue}
  if(e.w>0)e.w--;
  let S=e.w>0?e.s*e.sf:e.s,dx=t.x-e.x,dy=t.y-e.y,z=H(dx,dy);
  if(z>.01)e.ang=M.atan2(dy,dx);
  z<S?(e.x=t.x,e.y=t.y,e.i++):(e.x+=dx/z*S,e.y+=dy/z*S);
 }
 /* towers */
 bm.length=0;
 for(let t of tw){
  if(t.sn>0){t.sn--;continue}
  if(t.id==5){t.a+=.04;continue}
  if(t.id==2)t.gd=M.min(4,t.gd+.0018);
  let B=bf(t),R=t.r*B.r,D=effD(t,B),F=effF(t,B);if(t.cd>0)t.cd--;
  let tg=null,bs=-1e18;
  for(let e of en){let dist=H(e.x-t.x,e.y-t.y);if(dist>R)continue;let nx=pth[e.i]||{x:0,y:0},pg=e.i*1e4-H(nx.x-e.x,nx.y-e.y),sc=t.tm==0?pg:t.tm==1?-pg:t.tm==2?e.h:t.tm==3?-e.h:-dist;if(sc>bs){bs=sc;tg=e}}
  if(tg){t.a=M.atan2(tg.y-t.y,tg.x-t.x);
   if(t.id==4)bm.push({x1:t.x,y1:t.y,x2:tg.x,y2:tg.y,id:4,l:t.l});
   if(t.cd<=0){t.cd=F;if(t.id==2)t.gd=M.min(4,t.gd+.18);
    if(t.id==4){dm(tg,D,0,t);if(tg.h<=0)bm.pop()}
    else{pr.push({x:t.x,y:t.y,t:tg,s:t.s,d:D,k:t.k,sp:t.sp,sl:t.sl?t.l:0,tw:t,id:t.id});t.rc=1;ev.push(["s",t.id,t.x,t.y,t.l,t.uid])}}}
 }
 /* projectiles */
 for(let i=pr.length;i--;){
  let q=pr[i],dx=q.t.x-q.x,dy=q.t.y-q.y,z=H(dx,dy);
  if(z<q.s+q.t.r||q.t.h<=0){
   ev.push(["h",q.id,q.x,q.y]);
   if(q.sp)en.slice().forEach(e=>{H(e.x-q.x,e.y-q.y)<=q.sp&&dm(e,q.d,q.sl,q.tw)});else dm(q.t,q.d,q.sl,q.tw);
   pr.splice(i,1)}
  else{q.x+=dx/z*q.s;q.y+=dy/z*q.s}
 }
}

 }

 for(let i=flt.length;i--;){let f=flt[i];f.y-=dt*28;if((f.life-=dt*1.1)<=0)flt.splice(i,1)}

   case"S":if(scr=="match"||scr=="end")applySnap(o);break;

  }

function roomTick(now){
 if(!room||room.local)return;
 if(room.host){
  if(scr!=="room")return;
  if(now-annT>1000){annT=now;if(room.members.length<room.mode)NET.pub("lobby",{t:"party",f:myId,id:room.id,mode:room.mode,cnt:room.members.length,hn:save.name})}
  if(now-rosterT>1000){rosterT=now;sendRoster()}
  let before=room.members.length;room.members=room.members.filter(q=>q.id===myId||now-q.seen<7000);
  if(room.members.length!==before){room.cdAt=0;sendRoster()}
  if(room.cdAt){if(!allReady()){room.cdAt=0;sendRoster()}else if(now>=room.cdAt)startFromRoom()}
  else if(allReady())room.cdAt=now+3000,sendRoster();
 }else if(scr=="room"){
  if(room.joining){
   if(now-joinT>400){joinT=now;NET.pub("p/"+room.id,{t:"join",f:myId,n:save.name,c:save.col,vm:save.last.map,vd:save.last.df})}
   if(now-room.joining>3500){parties.delete(room.id);toast("That party is no longer available","#fb923c",2.5);leaveRoom()}
  }else{
   if(now-hbT>1000){hbT=now;NET.pub("p/"+room.id,{t:"hb",f:myId})}
   if(now-room.seen>5000){toast("Party closed","#f43f5e");leaveRoom()}
  }
 }
}

function lobbyUpdate(dt,now){
 if(scr!=="lobby")return;
 if(settingsOpen||helpOpen||confirmReset||nameEdit){lob.armed=false;lob.dw=0;lob.free=0;return}
 let px=lob.x*w,py=lob.y*h,tx=clamp(mx,28,w-28),ty=clamp(my,112,h-28),dx=tx-px,dy=ty-py,dist=H(dx,dy);
 if(dist>1){let step=M.min(dist,M.max(dist*7,70)*dt,760*dt);px+=dx/dist*step;py+=dy/dist*step;if(M.abs(dx)>3)lob.face=dx>0?1:-1}
 lob.x=px/w;lob.y=py/h;
 let q=-1;for(let i=0;i<3;i++){let r=sqRect(i);if(ptIn(px,py,r.x,r.y,r.s,r.s))q=i}
 lob.sq=q;
 /* joining must be deliberate: BOTH the mouse and the avatar rest inside the same square for 1.1s,
    and only after the mouse has been outside every square for 0.4s (after entering the lobby / closing a window) */
 let mq=-1;for(let i=0;i<3;i++){let r=sqRect(i);if(ptIn(mx,my,r.x,r.y,r.s,r.s))mq=i}
 lob.mq=mq;
 if(mq<0&&q<0){lob.free+=dt;if(lob.free>=.4)lob.armed=true;lob.dw=0}
 else if(mq>=0&&q===mq&&lob.armed){lob.dw+=dt;if(lob.dw>=1.1){lob.dw=0;lob.armed=false;lob.free=0;enterSquare(q)}}
 else lob.dw=0;
 let k=1-M.pow(.002,dt);
 peers.forEach((p,id)=>{if(now-p.seen>5000){peers.delete(id);return}p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;if(M.abs(p.tx-p.x)>.0005)p.face=p.tx>p.x?1:-1});
 parties.forEach((p,id)=>{if(now-p.seen>5000)parties.delete(id)});
 if(lob.emoT&&now-lob.emoT>2200)lob.emo=-1;
}
